[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callrhino"
version = "0.1.0"
description = "Meeting accountability for multilingual teams"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.11.7,<3",
  "pydantic-settings>=2.10.1,<3",
  "python-dotenv>=1.1.1,<2",
  "streamlit>=1.47.1,<2",
  "supabase>=2.17.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1,<10",
  "pytest-cov>=6.2.1,<7",
  "respx>=0.22.0,<0.23",
  "ruff>=0.12.5,<0.13",
]
eval = [
  "imageio-ffmpeg>=0.6,<1",
  "mlx-lm>=0.28,<1",
  "mlx-whisper>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/callrhino"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
